name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ChronoIsle.sln

      - name: Build (Release)
        run: dotnet build ChronoIsle.sln -c Release --no-restore

      - name: Test (Release)
        run: dotnet test tests/ChronoIsle.Tests/ChronoIsle.Tests.csproj -c Release --no-build --no-restore

      # Smoke test 不在 sln 里 + 依赖运行机的 ~/.claude 数据
      # CI 上没有 transcript，跑只是验证它能编译通过 + 不崩
      - name: UI automation contracts (Release)
        run: dotnet test tests/ChronoIsle.UiTests/ChronoIsle.UiTests.csproj -c Release --no-build --no-restore
      - name: Smoke test compiles & runs
        run: dotnet run --project tests/ChronoIsle.SmokeTest/ChronoIsle.SmokeTest.csproj -c Release
        continue-on-error: true
