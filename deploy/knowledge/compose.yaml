services:
  knowledge:
    build: .
    container_name: project-knowledge
    restart: unless-stopped
    ports:
      - "127.0.0.1:18765:8080"
    environment:
      Knowledge__DataRoot: /data
    volumes:
      - ./data:/data
      - ./secrets.json:/app/appsettings.Production.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 2
    healthcheck:
      test: ["CMD", "dotnet", "ChronoIsle.Knowledge.Server.dll", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
